<body>

<!-- Фон — ночная трасса, а не общий «горящий дом» остальных сервисов (см.
     Design/palette.md, «Исключение: приборная панель»): небо, зарево города
     на горизонте, дорога в перспективе с бегущей разметкой и пятнами фонарей.
     Скорость — от огонька (data-drive, ставит app.js). Стили — assets/styles.css. -->
<div class="road-bg" id="backdrop" data-drive="out" aria-hidden="true">
  <div class="sky"></div>
  <div class="road"><div class="road-plane"><div class="road-strip"></div></div></div>
  <div class="road-fog"></div>
</div>

<!-- Машина пользователя — плоский векторный седан, вид сзади и чуть
     сверху (видны крыша и крышка багажника), правая полоса. Фар нет: на этом
     масштабе свет выглядел больше самой машины. Под контентом. Реакции — классы ok / bad / lit (app.js: carReact):
     верно — газует, ошибка — стоп-сигналы и занос, огонёк — подскоки. -->
<div class="car" id="car" aria-hidden="true">
  <svg viewBox="0 0 160 150">
    <defs>
      <radialGradient id="brakeGlow">
        <stop offset="0" stop-color="#ff3b30" stop-opacity=".75"/>
        <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--car-dark)"/>
        <stop offset=".18" stop-color="var(--car-body)"/>
        <stop offset=".82" stop-color="var(--car-body)"/>
        <stop offset="1" stop-color="var(--car-dark)"/>
      </linearGradient>
    </defs>
    <ellipse class="car-shadow" cx="80" cy="145" rx="74" ry="6"/>
    <rect class="tyre" x="15" y="116" width="22" height="28" rx="5"/>
    <rect class="tyre" x="123" y="116" width="22" height="28" rx="5"/>
    <path class="light" d="M50 52 Q52 47 59 47 L101 47 Q108 47 110 52 Z"/>
    <path class="body" fill="url(#carBody)" d="M36 81 L46 56 Q48 52 54 52 L106 52 Q112 52 114 56 L124 81 Z"/>
    <path class="glass" d="M44 79 L52 59 Q53.4 57 56 57 L104 57 Q106.6 57 108 59 L116 79 Z"/>
    <path class="glint" d="M60 57 L74 57 L62 79 L48 79 Z"/>
    <path class="mirror" d="M31 77 L19 75 Q14.5 75 15 79.5 L16.5 83 L33 83 Z"/>
    <path class="mirror" d="M129 77 L141 75 Q145.5 75 145 79.5 L143.5 83 L127 83 Z"/>
    <path class="light" d="M28 87 L132 87 L125 80 L35 80 Z"/>
    <path class="body" fill="url(#carBody)" d="M12 100 Q12 88 26 87 L134 87 Q148 88 148 100 L150 126 Q150 134 142 134 L18 134 Q10 134 10 126 Z"/>
    <!-- Свечение стоп-сигналов — только вокруг фонарей, вспыхивает при ошибке. -->
    <ellipse class="brake-glow" cx="29" cy="97" rx="24" ry="13" fill="url(#brakeGlow)"/>
    <ellipse class="brake-glow" cx="131" cy="97" rx="24" ry="13" fill="url(#brakeGlow)"/>
    <path class="tail" d="M15 92 L45 92 L43 101 L13 103 Z"/>
    <path class="tail" d="M145 92 L115 92 L117 101 L147 103 Z"/>
    <path class="crease" d="M14 108 L146 108"/>
    <rect class="car-plate" x="61" y="106" width="38" height="11" rx="1.5"/>
    <rect class="car-flag" x="92" y="112" width="5" height="3"/>
    <rect class="bumper" x="12" y="124" width="136" height="11" rx="4"/>
  </svg>
</div>

<div class="topbar">
  <div class="bh-lockup">
    <a class="bh-lockup-home" href="https://burninghouse.ru" aria-label="BurningHouse — каталог сервисов">
      <svg class="bh-mark" viewBox="0 0 24 24" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="bhFlamePdd" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="var(--flame-base, #9a3412)"/>
            <stop offset="1" stop-color="var(--flame-tip, #ff7043)"/>
          </linearGradient>
        </defs>
        <path class="bh-flame" fill="url(#bhFlamePdd)" fill-rule="evenodd"
              d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
      </svg>
      <span class="bh-name">BurningHouse</span>
    </a>
    <span class="bh-sep" aria-hidden="true"></span>
    <a class="bh-lockup-service" href="/" data-link aria-label="Когда на права? — на главную сервиса">
      <span class="bh-service">Когда на права?</span>
    </a>
  </div>
  <div class="topbar-actions">
    <!-- Скрыта, пока браузер не предложит установку (beforeinstallprompt). -->
    <button class="icon-btn is-hidden" id="installBtn" type="button" title="Установить на экран" aria-label="Установить на экран">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 19h14"/></svg>
    </button>
    <button class="icon-btn" id="quietBtn" type="button" title="Приглушить фон" aria-label="Приглушить фон">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon-btn is-hidden" id="authBtn" type="button" title="Войти через аккаунт BurningHouse" aria-label="Войти через аккаунт BurningHouse">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
  </div>
</div>
