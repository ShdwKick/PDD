<body>

<!-- Фон — ночная трасса, а не общий «горящий дом» остальных сервисов (см.
     Design/palette.md, «Исключение: приборная панель»): небо, зарево города
     на горизонте, дорога в перспективе с бегущей разметкой и пятнами фонарей.
     Скорость — от огонька (data-drive, ставит app.js). Стили — assets/styles.css. -->
<div class="road-bg" id="backdrop" data-drive="out" aria-hidden="true">
  <div class="sky"></div>
  <div class="road"><div class="road-plane"><div class="road-strip"></div></div></div>
  <div class="road-fog"></div>
</div>

<!-- Машина пользователя — плоский векторный седан, вид сзади и чуть
     сверху (видны крыша и крышка багажника), правая полоса. Фар нет: на этом
     масштабе свет выглядел больше самой машины. Под контентом. Реакции — классы ok / bad / lit (app.js: carReact):
     верно — газует, ошибка — стоп-сигналы и занос, огонёк — подскоки. -->
<div class="car" id="car" aria-hidden="true">
  <svg viewBox="0 0 160 150">
    <defs>
      <radialGradient id="brakeGlow">
        <stop offset="0" stop-color="#ff3b30" stop-opacity=".75"/>
        <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--car-dark)"/>
        <stop offset=".18" stop-color="var(--car-body)"/>
        <stop offset=".82" stop-color="var(--car-body)"/>
        <stop offset="1" stop-color="var(--car-dark)"/>
      </linearGradient>
      <!-- Детали за значки: хром, тонировка-хамелеон, свечение LED-полосы. -->
      <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fb"/><stop offset=".5" stop-color="#9aa6b2"/><stop offset="1" stop-color="#e3e8ee"/></linearGradient>
      <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset=".55" stop-color="#14304f"/><stop offset="1" stop-color="#0d5a5a"/></linearGradient>
      <linearGradient id="ledGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b30" stop-opacity="0"/><stop offset=".5" stop-color="#ff3b30" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></linearGradient>
      <radialGradient id="underGlow">
        <stop offset="0" style="stop-color:var(--glow,#3aa0ff)" stop-opacity=".85"/>
        <stop offset="1" style="stop-color:var(--glow,#3aa0ff)" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Гараж (assets/motivation.js, CAR): детали и цвета включаются
         классами car-<категория>-<вариант> на .car (applyCar в app.js). -->
    <ellipse class="part p-glow" cx="80" cy="141" rx="84" ry="12" fill="url(#underGlow)"/>
    <ellipse class="car-shadow" cx="80" cy="145" rx="74" ry="6"/>
    <rect class="tyre" x="15" y="116" width="22" height="28" rx="5"/>
    <rect class="tyre" x="123" y="116" width="22" height="28" rx="5"/>
    <path class="light" d="M50 52 Q52 47 59 47 L101 47 Q108 47 110 52 Z"/>
    <path class="body" fill="url(#carBody)" d="M36 81 L46 56 Q48 52 54 52 L106 52 Q112 52 114 56 L124 81 Z"/>
    <path class="glass" d="M44 79 L52 59 Q53.4 57 56 57 L104 57 Q106.6 57 108 59 L116 79 Z"/>
    <path class="glint" d="M60 57 L74 57 L62 79 L48 79 Z"/>
    <g class="part p-tint"><path fill="url(#tint)" d="M44 79 L52 59 Q53.4 57 56 57 L104 57 Q106.6 57 108 59 L116 79 Z"/><path fill="#fff" opacity=".18" d="M60 57 L74 57 L62 79 L48 79 Z"/></g>
    <!-- Знаки «У» / «!» — в правом нижнем углу заднего стекла. -->
    <g class="part p-sign-u"><path d="M100 61.5 L108.5 76.5 L91.5 76.5 Z" fill="#fff" stroke="#e0241b" stroke-width="1.8" stroke-linejoin="round"/><text class="sign-text" x="100" y="75" font-size="7.5">У</text></g>
    <g class="part p-sign-beginner"><rect x="93" y="64" width="13" height="13" rx="1" fill="#f5c400" stroke="#111" stroke-width=".6"/><text class="sign-text" x="99.5" y="75" font-size="11">!</text></g>
    <g class="part p-fin"><path fill="var(--car-dark)" d="M74.5 47.5 Q75.5 35.5 80 35 Q84.5 35.5 85.5 47.5 Z"/><path fill="var(--car-light)" opacity=".55" d="M77.5 46 Q78 38 80 37.5 L80 46 Z"/></g>
    <g class="part p-taxi"><rect x="77" y="45" width="6" height="3" fill="#2a2f37"/><rect x="63" y="36" width="34" height="10" rx="2" fill="#f5c400"/>
      <g fill="#111"><rect x="63" y="42" width="3.4" height="2"/><rect x="69.8" y="42" width="3.4" height="2"/><rect x="76.6" y="42" width="3.4" height="2"/><rect x="83.4" y="42" width="3.4" height="2"/><rect x="90.2" y="42" width="3.4" height="2"/><rect x="66.4" y="44" width="3.4" height="2"/><rect x="73.2" y="44" width="3.4" height="2"/><rect x="80" y="44" width="3.4" height="2"/><rect x="86.8" y="44" width="3.4" height="2"/><rect x="93.6" y="44" width="3.4" height="2"/></g>
      <text class="sign-text" x="80" y="41.2" font-size="5">ТАКСИ</text></g>
    <path class="mirror" d="M31 77 L19 75 Q14.5 75 15 79.5 L16.5 83 L33 83 Z"/>
    <path class="mirror" d="M129 77 L141 75 Q145.5 75 145 79.5 L143.5 83 L127 83 Z"/>
    <path class="light" d="M28 87 L132 87 L125 80 L35 80 Z"/>
    <path class="body" fill="url(#carBody)" d="M12 100 Q12 88 26 87 L134 87 Q148 88 148 100 L150 126 Q150 134 142 134 L18 134 Q10 134 10 126 Z"/>
    <!-- Свечение стоп-сигналов — только вокруг фонарей, вспыхивает при ошибке. -->
    <ellipse class="brake-glow" cx="29" cy="97" rx="24" ry="13" fill="url(#brakeGlow)"/>
    <ellipse class="brake-glow" cx="131" cy="97" rx="24" ry="13" fill="url(#brakeGlow)"/>
    <path class="tail" d="M15 92 L45 92 L43 101 L13 103 Z"/>
    <path class="tail" d="M145 92 L115 92 L117 101 L147 103 Z"/>
    <path class="crease" d="M14 108 L146 108"/>
    <rect class="car-plate" x="61" y="106" width="38" height="11" rx="1.5"/>
    <rect class="car-flag" x="92" y="112" width="5" height="3"/>
    <!-- Свой номер из гаража (motivation.js PLATE_*), пишет applyCar в app.js. -->
    <text class="plate-text" x="76.5" y="114.4"></text>
    <rect class="bumper" x="12" y="124" width="136" height="11" rx="4"/>
    <g class="part p-stripes">
      <rect x="69" y="52" width="7" height="5"/><rect x="84" y="52" width="7" height="5"/>
      <rect x="69" y="87" width="7" height="19"/><rect x="84" y="87" width="7" height="19"/>
      <rect x="69" y="117" width="7" height="7"/><rect x="84" y="117" width="7" height="7"/>
    </g>
    <g class="part p-spoiler">
      <rect class="sp-leg" x="40" y="83" width="5" height="6"/><rect class="sp-leg" x="115" y="83" width="5" height="6"/>
      <path class="sp-wing" d="M18 77 L142 77 L138 84 L22 84 Z"/>
    </g>
    <g class="part p-fire">
      <path class="exhaust" d="M32 135 Q27 141 32 150 Q37 141 32 135 Z"/>
      <path class="exhaust" d="M128 135 Q123 141 128 150 Q133 141 128 135 Z"/>
    </g>
    <g class="part p-led"><rect x="38" y="91" width="84" height="8" fill="url(#ledGlow)"/><rect x="43" y="94" width="74" height="2.2" rx="1.1" fill="#ff5147"/></g>
    <g class="part p-chrome"><path d="M14 108 L146 108" stroke="url(#chrome)" stroke-width="1.8"/><rect x="59" y="104" width="42" height="15" rx="2.5" fill="none" stroke="url(#chrome)" stroke-width="1.8"/><path d="M36 86.5 L124 86.5" stroke="url(#chrome)" stroke-width="1.4"/></g>
    <g class="part p-diffuser"><path fill="#0a0d11" d="M52 135 L108 135 L104 128 L56 128 Z"/><path stroke="#2c333c" stroke-width="1.2" d="M66 128.5 V135 M75 128.5 V135 M85 128.5 V135 M94 128.5 V135"/>
      <ellipse cx="27" cy="131" rx="3.6" ry="2.6" fill="#15191e" stroke="url(#chrome)" stroke-width="1.3"/><ellipse cx="36" cy="131" rx="3.6" ry="2.6" fill="#15191e" stroke="url(#chrome)" stroke-width="1.3"/>
      <ellipse cx="124" cy="131" rx="3.6" ry="2.6" fill="#15191e" stroke="url(#chrome)" stroke-width="1.3"/><ellipse cx="133" cy="131" rx="3.6" ry="2.6" fill="#15191e" stroke="url(#chrome)" stroke-width="1.3"/></g>
    <g class="part p-race"><circle cx="126" cy="114" r="7" fill="#fff" stroke="#111" stroke-width="1"/><text class="sign-text" x="126" y="117" font-size="8.5">7</text>
      <rect x="22" y="110" width="20" height="8" fill="#fff"/><g fill="#111"><rect x="22" y="110" width="4" height="4"/><rect x="30" y="110" width="4" height="4"/><rect x="38" y="110" width="4" height="4"/><rect x="26" y="114" width="4" height="4"/><rect x="34" y="114" width="4" height="4"/></g></g>
  </svg>
</div>

<div class="topbar">
  <div class="bh-lockup">
    <a class="bh-lockup-home" href="https://burninghouse.ru" aria-label="BurningHouse — каталог сервисов">
      <svg class="bh-mark" viewBox="0 0 24 24" role="img" aria-hidden="true">

          <linearGradient id="bhFlamePdd" x1="0" y1="1" x2="0" y2="0">

        </defs>
        <path class="bh-flame" fill="url(#bhFlamePdd)" fill-rule="evenodd"
              d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
      </svg>
      <span class="bh-name">BurningHouse</span>

    <span class="bh-sep" aria-hidden="true"></span>

  </div>
  <div class="topbar-actions">

    <button class="icon-btn is-hidden" id="installBtn" type="button" title="Установить на экран" aria-label="Установить на экран">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 19h14"/></svg>

    <button class="icon-btn is-hidden" id="authBtn" type="button" title="Войти через аккаунт BurningHouse" aria-label="Войти через аккаунт BurningHouse">

    </button>
    <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
  </div>
</div>

<!-- Скелет — виден сразу, пока грузятся скрипты и проверяется вход; первый же
     route() в app.js заменяет содержимое #view. Повторяет раскладку настоящих
     экранов (те же .dash/.dials/.plates/.strip), чтобы при замене ничего не
     прыгало. Вариант — по адресу, строкой скрипта ниже. -->
<main id="view" aria-busy="true">
  <p class="sr-only">Загрузка…</p>
  <div class="sk-hub" aria-hidden="true">
    <section class="hero"><i class="sk sk-title"></i><i class="sk sk-line w80"></i><i class="sk sk-line w70"></i><i class="sk sk-line w40"></i></section>
    <section class="dash">
      <div class="sk-streak"><i class="sk sk-dot"></i><span class="sk-col"><i class="sk sk-line w50 tall"></i><i class="sk sk-line w80"></i><i class="sk sk-bar"></i></span></div>
      <div class="sk-foot">
        <i class="sk sk-line w90"></i><i class="sk sk-line w50"></i>
        <div class="sk-split"><i class="sk sk-line w40"></i><i class="sk sk-pillbtn"></i></div>
        <div class="sk-split"><i class="sk sk-line w60"></i><i class="sk sk-pillbtn short"></i></div>
      </div>
      <div class="dials">
        <span class="dial"><i class="sk sk-dial"></i><i class="sk sk-line w60"></i></span>
        <span class="dial big"><i class="sk sk-dial"></i><i class="sk sk-line w60"></i></span>
        <span class="dial"><i class="sk sk-dial"></i><i class="sk sk-line w60"></i></span>
      </div>
      <div class="sk-ready">
        <div class="sk-split"><i class="sk sk-line w50"></i><i class="sk sk-line w20 tall"></i></div>
        <i class="sk sk-bar"></i><i class="sk sk-line w90"></i><i class="sk sk-line w70"></i><i class="sk sk-line w50"></i><i class="sk sk-pillbtn"></i>
      </div>
    </section>
    <div class="lamps"></div>
    <div class="actions hub-actions"><i class="sk sk-btn"></i><i class="sk sk-btn"></i></div>
    <div class="plates sk-plates"><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i><i class="sk sk-plate"></i></div>
  </div>
  <div class="sk-quiz" aria-hidden="true">
    <div class="ex-header"><i class="sk sk-dot"></i><span class="sk-col"><i class="sk sk-line w40 tall"></i><i class="sk sk-line w20"></i></span></div>
    <div class="strip"><span class="strip-block"><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i></span><span class="strip-block"><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i></span><span class="strip-block"><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i></span><span class="strip-block"><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i><i class="sk sk-pill"></i></span></div>
    <section class="card sk-qcard"><i class="sk sk-img"></i><i class="sk sk-line w30"></i><i class="sk sk-line w90 tall"></i><i class="sk sk-line w70 tall"></i><i class="sk sk-answer"></i><i class="sk sk-answer"></i><i class="sk sk-answer"></i></section>
  </div>
  <div class="sk-doc" aria-hidden="true">
    <div class="ex-header"><i class="sk sk-dot"></i><span class="sk-col"><i class="sk sk-line w40 tall"></i><i class="sk sk-line w30"></i></span></div>
    <section class="card sk-qcard"><i class="sk sk-line w40 tall"></i><i class="sk sk-line w90"></i><i class="sk sk-line w80"></i><i class="sk sk-line w60"></i><i class="sk sk-line w40 tall"></i><i class="sk sk-line w90"></i><i class="sk sk-line w70"></i></section>
  </div>
</main>
<script>
  // Какой скелет показать — до загрузки app.js, чтобы не мигал чужой экран.
  (function (p) {
    document.getElementById("view").dataset.sk = p === "/" || p === "/index.html" ? "hub"
      : /^\/(bilet|ekzamen|mini|question|oshibki|tema)(\/|$)/.test(p) ? "quiz" : "doc";
  })(location.pathname.replace(/\/+$/, "") || "/");
</script>
