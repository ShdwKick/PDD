name: bh-pdd

services:
  pdd:
    build: .
    image: shadowkick/pdd:latest
    container_name: pdd
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8798
      # Локальный auth — проще всего node dev.mjs, он поднимет всё сам.
      AUTH_ISSUER: http://localhost:8792
      AUTH_CLIENT_ID: pdd
    ports:
      # Только localhost — наружу отдаёт nginx.
      - "127.0.0.1:8798:8798"
    volumes:
      - pdd-data:/app/data

volumes:
  pdd-data:
