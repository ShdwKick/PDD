name: bh-pdd

services:
  pdd:
    image: shadowkick/pdd:latest
    container_name: pdd
    restart: unless-stopped
    labels:
      # Watchtower обновляет контейнер сам, когда в Docker Hub появляется новый
      # образ (установка: deploy/watchtower-compose.yml в репозитории Auth).
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      HOST: 0.0.0.0
      PORT: 8798
      # ОБЯЗАТЕЛЬНО ровно тот адрес, что задан у auth в ISSUER: он подписан внутрь
      # токенов. Регистрация клиента в auth (один раз):
      #   docker compose exec auth node server.js client-add pdd "Когда на права?" https://pdd.burninghouse.ru/
      AUTH_ISSUER: https://auth.burninghouse.ru
      AUTH_CLIENT_ID: pdd
      # Вечерние напоминания «огонёк гаснет» шлются через auth /internal/notifications
      # по общему ключу — тому же ADMIN_INTERNAL_KEY, что у Admin. Хранится в .env
      # рядом с этим файлом (bash set-env.sh ADMIN_INTERNAL_KEY <ключ>). Без ключа
      # напоминания просто выключены, остальное работает.
      ADMIN_INTERNAL_KEY: ${ADMIN_INTERNAL_KEY:-}
      # Пояснения к ответам свои (bank/tips-own.json) — поисковики пускаем.
      # INDEXABLE: "0" закроет сайт целиком (meta robots + robots.txt).
      INDEXABLE: "1"
      # Приложение для Android (android/): SHA-256 сертификатов, которыми оно
      # подписано, — для /.well-known/assetlinks.json (без него приложение
      # открывается с адресной строкой). Не секрет. Через запятую: ключ
      # загрузки (APK в обход стора) и, после выкладки, ключ подписи Google Play
      # (Play Console → Целостность приложения → Подпись приложения).
      ANDROID_CERT_SHA256: "9C:0A:87:11:81:BD:4A:C3:76:BC:20:73:D4:40:E5:36:18:B0:C3:E8:8F:79:C6:D3:1C:95:22:11:2E:BF:45:37"
    ports:
      # Только на localhost — наружу отдаёт nginx на 443 (deploy/install-nginx.sh).
      - "127.0.0.1:8798:8798"
    volumes:
      - pdd-data:/app/data

volumes:
  pdd-data:
